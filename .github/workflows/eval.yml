name: eval

# 每晚跑一次黄金集评估，指标回归自动拦截。
# 需要在仓库 Settings -> Secrets and variables -> Actions 配置 ZHIPUAI_API_KEY
# （或 DEEPSEEK_API_KEY + RAG_LLM_PROVIDER=deepseek 的仓库变量）。
on:
  schedule:
    - cron: "0 20 * * *" # UTC 20:00 = 北京时间 04:00
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # BGE-M3 / bge-reranker-v2-m3 是公开模型，CI 里直接从 HuggingFace 下载
      - name: Download models
        run: |
          uv run python - <<'EOF'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id="BAAI/bge-m3", local_dir="BGE-M3")
          snapshot_download(repo_id="BAAI/bge-reranker-v2-m3", local_dir="bge-reranker-v2-m3")
          print("模型下载完成")
          EOF

      - name: Ingest corpus
        run: uv run python -m rag_learning ingest

      - name: Run evaluation
        env:
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
        run: uv run python -m rag_learning eval

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: eval/reports/
          retention-days: 30
